name: Deterministic contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - name: Ensure contract tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          python3 --version
          rg --version
      - name: Build and run offline fixture contracts
        run: python3 Tests/run.py
