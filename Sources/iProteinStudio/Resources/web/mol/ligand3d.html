<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font:12px -apple-system,sans-serif;background:#f5f5f7}#viewer{position:absolute;inset:0}#tools{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:5}button{padding:5px 9px;border:1px solid #b9bec7;border-radius:5px;background:#fff;color:#222;cursor:pointer}#hint{position:absolute;bottom:5px;left:8px;right:8px;background:#ffffffdf;border-radius:4px;padding:4px;pointer-events:none;font-size:11px;white-space:normal;overflow-wrap:anywhere}#status{position:absolute;top:45px;left:8px;background:#ffffffdf;pointer-events:none}
</style><script src="3Dmol-min.js"></script></head><body>
<div id="viewer"></div><div id="tools"><button id="fit" aria-label="Reset molecule view">Reset view</button><button id="plus" aria-label="Zoom in">＋</button><button id="minus" aria-label="Zoom out">−</button><button id="cone" hidden>Hide exit samples</button></div><div id="status"></div><div id="hint">Drag to rotate · scroll or pinch to zoom · Control-drag to pan</div>
<script>
'use strict';
let viewer=$3Dmol.createViewer(document.getElementById('viewer'),{backgroundColor:'#f5f5f7',antialias:true});
let payload=null,state={},model=null,showCone=true,down=null,moved=false;
const colours={buried:'#7c3aed',exposed:'#0891b2',hbondDonor:'#2563eb',hbondAcceptor:'#c2410c',hotspot:'#be185d'};
const point=a=>({x:a[0],y:a[1],z:a[2]});
function decode(b){return JSON.parse(decodeURIComponent(escape(atob(b))));}
function reset(){viewer.resize();viewer.zoomTo(payload&&payload.cone?{chain:payload.ligand_chain||'B'}:{});viewer.zoom(payload&&payload.cone ? .65 : .8);viewer.render();}
window.loadPayloadB64=function(b){
  payload=decode(b);viewer.clear();state={};model=null;
  if(payload.sdf){model=viewer.addModel(payload.sdf,'sdf');viewer.setStyle({},{stick:{radius:.14},sphere:{scale:.24}});}
  else if(payload.structure_b64){model=viewer.addModel(decodeURIComponent(escape(atob(payload.structure_b64))),payload.format||'cif');
    viewer.setStyle({},{cartoon:{color:'#9aaab7',opacity:.5}});viewer.setStyle({hetflag:true},{stick:{radius:.16}});
    viewer.setStyle({chain:payload.ligand_chain||'B'},{stick:{radius:.19},sphere:{scale:.23}});
    if(payload.cone)viewer.addSurface($3Dmol.SurfaceType.VDW,{color:'#b8bfc5',opacity:.35},{chain:'A',within:{distance:8,sel:{chain:payload.ligand_chain||'B'}}}).then(()=>viewer.render());
  }
  document.getElementById('cone').hidden=!payload.cone;
  if(payload.cone){document.getElementById('hint').textContent='Drag to rotate · scroll/pinch to zoom · Control-drag to pan. Samples at physical scale; no continuous-access or binding-probability claim.';
    const c=payload.cone.counts;document.getElementById('status').textContent='Teal: wide '+c.wide+' · amber: limited '+c.limited+' · red: clash '+c.clash;
  }else{document.getElementById('status').textContent='Display conformer · not a predicted bound pose';}
  decorate();reset();
};
window.setStateB64=function(b){state=decode(b);decorate();};
function decorate(){
  if(!model)return;
  viewer.removeAllLabels();viewer.removeAllShapes();
  if(payload.sdf){
    viewer.setStyle({},{stick:{radius:.14},sphere:{scale:.24}});
    const atoms=model.selectedAtoms({});
    atoms.forEach((atom,i)=>{
      let name=state.labels&&state.labels.length===atoms.length?state.labels[i]:String(i);
      let roles=(state.conditions&&state.conditions[name]||[]).filter(r=>colours[r]);
      const colour=roles.length?colours[roles[0]]:(state.presentation||[]).includes(i)?'#d97706':(state.core||[]).includes(i)?'#10b981':null;
      if(colour)viewer.addSphere({center:atom,radius:.55,color:colour,opacity:.5});
      if(i===state.attachment||i===state.linker)viewer.addSphere({center:atom,radius:.72,color:i===state.attachment?'#2563eb':'#d97706',opacity:.45});
      viewer.addLabel(name+(roles.length?' · '+roles.join('/') :''),{position:atom,fontSize:10,backgroundOpacity:.7,fontColor:'#334155',backgroundColor:'#ffffff',inFront:true});
      atom._studioIndex=i;
    });
    viewer.setClickable({},!!state.picking,function(atom){
      if(moved)return;
      const i=atom._studioIndex;
      if(!Number.isInteger(i))return;
      let a=state.attachment??-1,b=state.linker??-1;
      if(a<0){a=i;b=-1;}else if(b<0&&i!==a&&(payload.bonds||[]).some(v=>(v.a===a&&v.b===i)||(v.b===a&&v.a===i))){b=i;}
      else if(i===a||i===b){a=-1;b=-1;}else{a=i;b=-1;}
      state.attachment=a;state.linker=b;decorate();
      if(window.webkit?.messageHandlers?.ligand3d)window.webkit.messageHandlers.ligand3d.postMessage({core:a,linker:b});
    });
  }
  if(payload.cone&&showCone){
    const cone=payload.cone;
    for(let i=1;i<cone.stem.length;i++)viewer.addCylinder({start:point(cone.stem[i-1]),end:point(cone.stem[i]),radius:.065,color:'#0d8fa6'});
    cone.stubs.forEach((stub,i)=>{
      const colour={wide:'#0d9488',limited:'#e5a13b',clash:'#dc5360'}[cone.labels[i]];
      viewer.addCylinder({start:point(stub[1]),end:point(stub[2]),radius:.035,color:colour});
      viewer.addSphere({center:point(stub[2]),radius:.075,color:colour});
    });
  }
  viewer.render();
}
document.getElementById('fit').onclick=reset;
document.getElementById('plus').onclick=()=>{viewer.zoom(1.25);viewer.render();};
document.getElementById('minus').onclick=()=>{viewer.zoom(payload&&payload.cone ? .65 : .8);viewer.render();};
document.getElementById('cone').onclick=function(){showCone=!showCone;this.textContent=showCone?'Hide exit samples':'Show exit samples';decorate();};
const canvas=document.getElementById('viewer');
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];moved=false;},true);
canvas.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)moved=true;},true);
canvas.addEventListener('pointerup',()=>{down=null;},true);
new ResizeObserver(()=>{viewer.resize();viewer.render();}).observe(canvas);
</script></body></html>
