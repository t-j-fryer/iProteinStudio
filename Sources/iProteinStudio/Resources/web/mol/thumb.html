<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; }
    /* Fixed pixel size: offscreen renders need a real size for WebGL readback. */
    #v { width: 480px; height: 340px; position: relative; background: #f5f5f7; }
  </style>
  <script src="3Dmol-min.js"></script>
</head>
<body>
  <div id="v"></div>
  <script>
    let viewer = $3Dmol.createViewer(document.getElementById('v'),
      { backgroundColor: '0xf5f5f7', antialias: true });
    // Render a structure; Swift then reads viewer.pngURI().
    function renderThumbB64(b64, format) {
      viewer.clear();
      const text = decodeURIComponent(escape(window.atob(b64)));
      viewer.addModel(text, format || 'cif');
      viewer.setStyle({}, { cartoon: { color: '0xc0504d', arrows: true, thickness: 0.9 } });
      viewer.setStyle({ chain: 'A' }, { cartoon: { color: '0xc0504d', arrows: true, thickness: 0.9 } });
      viewer.setStyle({ chain: 'B' }, { cartoon: { color: '0xcbd0d8', arrows: true, thickness: 0.9 } });
      viewer.zoomTo();
      viewer.zoom(0.92);
      viewer.render();
      return "ok";
    }
  </script>
</body>
</html>
