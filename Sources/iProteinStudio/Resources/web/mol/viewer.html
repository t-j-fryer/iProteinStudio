<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    /* Solid background (transparent WebGL readback caused the model to vanish
       on zoom inside WKWebView). Theme-aware. */
    :root { color-scheme: light dark; }
    body { background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e22; } }
    #v { width: 100%; height: 100%; position: relative; }
  </style>
  <script src="3Dmol-min.js"></script>
</head>
<body>
  <div id="v"></div>
  <script>
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const BG = dark ? '0x1e1e22' : '0xf5f5f7';
    let viewer = null, hasModel = false;

    function ensureViewer() {
      if (!viewer) {
        viewer = $3Dmol.createViewer(document.getElementById('v'),
          { backgroundColor: BG, antialias: true });
      }
      return viewer;
    }
    function fit() {
      if (!viewer || !hasModel) return;
      viewer.resize();
      viewer.zoomTo();
      viewer.zoom(0.9);   // small margin so the whole complex is visible
      viewer.render();
    }
    const ro = new ResizeObserver(() => fit());
    ro.observe(document.getElementById('v'));

    function loadStructureB64(b64, format) {
      const v = ensureViewer();
      v.clear();
      const text = decodeURIComponent(escape(window.atob(b64)));
      v.addModel(text, format || 'cif');
      // PyMOL-style solid-colour cartoon: binder salmon, target silver-grey.
      v.setStyle({}, { cartoon: { color: '0xc0504d', arrows: true, thickness: 0.9 } });
      v.setStyle({ chain: 'A' }, { cartoon: { color: '0xc0504d', arrows: true, thickness: 0.9 } });
      v.setStyle({ chain: 'B' }, { cartoon: { color: '0xcbd0d8', arrows: true, thickness: 0.9 } });
      hasModel = true;
      v.resize();
      v.zoomTo();
      v.zoom(0.9);
      v.render();
    }
    function resetView() { fit(); }
    window.addEventListener('load', () => setTimeout(fit, 0));
  </script>
</body>
</html>
