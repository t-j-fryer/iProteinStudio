<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    /* Molecule depictions read best on white; keep it white in both themes. */
    body { background: #ffffff; display: flex; align-items: center; justify-content: center; }
    #draw { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #draw svg { max-width: 100%; max-height: 100%; }
    #msg { position: absolute; font: 12px -apple-system, sans-serif; color: #999; }
  </style>
  <script src="RDKit_minimal.js"></script>
</head>
<body>
  <div id="draw"></div>
  <div id="msg">Enter a SMILES string</div>
  <script>
    let ready = false, pending = "";
    const drawEl = document.getElementById('draw');
    const msg = document.getElementById('msg');

    // The host injects the WASM bytes (base64) — fetch() is blocked on file://.
    window.initRDKitWithWasm = function (b64) {
      let bin;
      try { bin = Uint8Array.from(window.atob(b64), function (c) { return c.charCodeAt(0); }); }
      catch (e) { setMsg('Could not load the molecule renderer.'); return; }
      initRDKitModule({ wasmBinary: bin }).then(function (RDKit) {
        window.RDKit = RDKit; ready = true; render(pending);
      }).catch(function () { setMsg('Could not load the molecule renderer.'); });
    };

    function setMsg(t) { drawEl.innerHTML = ''; msg.textContent = t; msg.style.display = 'block'; }

    function drawSmilesB64(b64) { pending = b64 || ""; if (ready) render(pending); }

    function render(b64) {
      const smi = b64 ? decodeURIComponent(escape(window.atob(b64))).trim() : "";
      if (!smi) { setMsg('Enter a SMILES string'); return; }
      let mol = null;
      try { mol = window.RDKit.get_mol(smi); } catch (e) { mol = null; }
      if (!mol || !mol.is_valid || !mol.is_valid()) { if (mol) mol.delete(); setMsg('Invalid SMILES'); return; }
      const w = Math.max(120, drawEl.clientWidth || 460);
      const h = Math.max(100, drawEl.clientHeight || 240);
      const svg = mol.get_svg(w, h);
      mol.delete();
      drawEl.innerHTML = svg;
      msg.style.display = 'none';
    }
  </script>
</body>
</html>
