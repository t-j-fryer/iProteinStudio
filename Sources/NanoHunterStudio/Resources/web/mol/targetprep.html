<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    :root { color-scheme: light dark; }
    body { background: #f5f5f7; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e22; } }
    #v { width: 100%; height: 100%; position: relative; }
    #hover {
      position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px;
      font: 12px -apple-system, sans-serif; background: rgba(0,0,0,0.6); color: white;
      pointer-events: none; opacity: 0; transition: opacity .1s;
    }
  </style>
  <script src="3Dmol-min.js"></script>
</head>
<body>
  <div id="v"><div id="hover"></div></div>
  <script>
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const BG = dark ? '0x1e1e22' : '0xf5f5f7';
    const viewer = $3Dmol.createViewer(document.getElementById('v'), { backgroundColor: BG, antialias: true });
    const hoverEl = document.getElementById('hover');
    let selected = new Set();
    let surfaceOn = false;

    // Kyte-Doolittle hydrophobicity (higher = more hydrophobic).
    const KD = {ILE:4.5,VAL:4.2,LEU:3.8,PHE:2.8,CYS:2.5,MET:1.9,ALA:1.8,GLY:-0.4,
      THR:-0.7,SER:-0.8,TRP:-0.9,TYR:-1.3,PRO:-1.6,HIS:-3.2,GLU:-3.5,GLN:-3.5,
      ASP:-3.5,ASN:-3.5,LYS:-3.9,ARG:-4.5};
    function hydroColor(atom) {
      const kd = KD[atom.resn] != null ? KD[atom.resn] : 0;
      const t = Math.max(0, Math.min(1, (kd + 4.5) / 9)); // 0 hydrophilic .. 1 hydrophobic
      // diverging: blue (hydrophilic) -> white -> orange (hydrophobic)
      let r,g,b;
      if (t < 0.5) { const u=t/0.5; r=Math.round(59+(245-59)*u); g=Math.round(111+(245-111)*u); b=Math.round(176+(245-176)*u); }
      else { const u=(t-0.5)/0.5; r=Math.round(245+(217-245)*u); g=Math.round(245+(120-245)*u); b=Math.round(245+(50-245)*u); }
      return (r<<16)|(g<<8)|b;
    }

    function baseStyle() {
      if (surfaceOn) {
        // Colour the cartoon by the SAME hydrophobicity scale as the surface, so
        // the residue beneath an orange patch is itself orange and easy to click.
        viewer.setStyle({}, { cartoon: { colorfunc: hydroColor, arrows: true, thickness: 0.9 } });
      } else {
        viewer.setStyle({}, { cartoon: { color: '0x6e86b8', arrows: true, thickness: 0.9 } });
      }
      // Highlight selected residues as bold red sticks (visible through the surface).
      selected.forEach(resi => viewer.setStyle({resi: resi}, {
        cartoon: surfaceOn ? { colorfunc: hydroColor, arrows: true, thickness: 0.9 }
                           : { color: '0x6e86b8', arrows: true, thickness: 0.9 },
        stick: { color: '0xe03b3b', radius: 0.4 }
      }));
    }

    // Replace the whole selection from Swift (e.g. removing one chip). Does not
    // post back, to avoid a feedback loop with click selection.
    function setSelection(arr) {
      var next = new Set(arr);
      var same = next.size === selected.size && Array.from(next).every(function(r){ return selected.has(r); });
      if (same) return;
      selected = next;
      rebuild();
    }

    function loadTargetB64(b64, format) {
      viewer.clear(); selected = new Set(); surfaceOn = false;
      const text = decodeURIComponent(escape(window.atob(b64)));
      viewer.addModel(text, format || 'cif');
      baseStyle();
      viewer.setHoverable({}, true,
        function(atom) {
          hoverEl.textContent = atom.resn + ' ' + atom.resi + (atom.chain ? ' · ' + atom.chain : '');
          hoverEl.style.opacity = 1;
        },
        function() { hoverEl.style.opacity = 0; });
      viewer.setClickable({}, true, function(atom) { toggleResidue(atom.resi); });
      viewer.zoomTo(); viewer.zoom(0.9); viewer.render();
      postSelection();
    }

    // Ligand-only view: ball-and-stick, colored by element, hover shows atom.
    function loadLigandB64(b64, format) {
      viewer.clear(); selected = new Set(); surfaceOn = false;
      const text = decodeURIComponent(escape(window.atob(b64)));
      viewer.addModel(text, format || 'cif');
      viewer.setStyle({}, { stick: { radius: 0.18, colorscheme: 'default' },
                            sphere: { scale: 0.28, colorscheme: 'default' } });
      viewer.setHoverable({}, true,
        function(atom) {
          hoverEl.textContent = (atom.elem || atom.atom || '') + (atom.serial != null ? ' ' + atom.serial : '');
          hoverEl.style.opacity = 1;
        },
        function() { hoverEl.style.opacity = 0; });
      viewer.zoomTo(); viewer.zoom(0.85); viewer.render();
    }

    function toggleResidue(resi) {
      if (selected.has(resi)) selected.delete(resi); else selected.add(resi);
      rebuild();
      postSelection();
    }
    function rebuild() {
      viewer.removeAllSurfaces();
      baseStyle();
      if (surfaceOn) addHydroSurface();
      viewer.render();
    }
    function addHydroSurface() {
      // Translucent so the (clickable) cartoon shows through and can be aimed at.
      // The surface itself is non-clickable, so clicks pass through to the cartoon.
      viewer.addSurface($3Dmol.SurfaceType.SAS, { opacity: 0.55, colorfunc: hydroColor });
    }
    function setSurface(on) { surfaceOn = on; rebuild(); }
    function clearSelection() { selected = new Set(); rebuild(); postSelection(); }
    function fit() { viewer.resize(); viewer.zoomTo(); viewer.zoom(0.9); viewer.render(); }

    function postSelection() {
      const arr = Array.from(selected).sort((a,b)=>a-b);
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hotspots) {
        window.webkit.messageHandlers.hotspots.postMessage(JSON.stringify(arr));
      }
    }

    new ResizeObserver(() => { if (viewer) fit(); }).observe(document.getElementById('v'));
    window.addEventListener('load', () => setTimeout(fit, 0));
  </script>
</body>
</html>
